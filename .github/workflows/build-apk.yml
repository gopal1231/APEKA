name: Build GOPAL AI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract GOPAL project
        run: |
          unzip -q gopal-ai-project.zip -d gopal-project

      - name: Build APK
        working-directory: gopal-project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOPAL-AI-V1-debug
          path: gopal-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
